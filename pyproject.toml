[project]
name = "pydantic-rag-agent"
version = "0.1.1"
description = "A RAG agent built on Pydantic."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nick", email = "98120512+hanku4u@users.noreply.github.com" }
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "pydantic",
    "pydantic-ai",
    "llm",
    "vector-search",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]
requires-python = ">=3.11"

# Core is what the agent needs to run at all: models, loaders, the CLI and the
# in-memory store. Everything a user might not want — a vector database, a web
# framework, a UI toolkit, an object store — is an extra.
dependencies = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydantic-ai-slim[openai]>=2.61,<3",
    "pydantic-settings>=2.16.1",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "rich>=15.0.0",
    "tiktoken>=0.14.0",
    "typer>=0.27.3",
]

[project.optional-dependencies]
chroma = ["chromadb>=1.5.9"]
api = [
    "fastapi>=0.162.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]
ui = ["streamlit>=1.66.1"]
s3 = ["boto3>=1.35"]
all = ["pydantic-rag-agent[chroma,api,ui,s3]"]

[project.scripts]
pydantic-rag-agent = "pydantic_rag_agent.cli:main"

[project.urls]
Homepage = "https://github.com/hanku4u/pydantic-rag-agent"
Repository = "https://github.com/hanku4u/pydantic-rag-agent"
Documentation = "https://github.com/hanku4u/pydantic-rag-agent/blob/main/docs/README.md"
Issues = "https://github.com/hanku4u/pydantic-rag-agent/issues"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    # The optional stacks, repeated here on purpose. uv 0.13 has no `default-extras`,
    # and the suite imports FastAPI, Streamlit and Chroma; without these a plain
    # `uv sync` would produce an environment that cannot run its own tests. Users get
    # them through extras, not through this group.
    "boto3>=1.35",
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "python-multipart>=0.0.32",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Shared builders live in tests/factories.py and are imported as `factories`.
pythonpath = ["tests"]
# Tests are named for the guarantee they make (..._should_...), as set out in
# docs/development/testing.md, so discovery follows that convention rather than
# forcing a redundant `test_` prefix onto every name.
python_functions = ["test_*", "*_should_*"]

[tool.coverage.run]
# Measure the package, not the tests.
source = ["pydantic_rag_agent"]
branch = true

[tool.coverage.report]
# TST-1 asks for coverage of loaders, chunker, stores and the agent loop; all four
# are far above this. The floor exists to stop a regression going unnoticed, not to
# claim the number is good. `ui/` is excluded because it is verified by launching it,
# as `docs/development/testing.md` records, and `dev`/`serve` spawn processes that a
# unit test cannot meaningfully drive.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
omit = ["*/ui/*"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

# pypdfium2 ships no py.typed marker, so its API arrives as Any. Confined to one
# thin adapter that is tested against real PDFs, which is the mitigation.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
