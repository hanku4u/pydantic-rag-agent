name: Release

# Two ways in, one build:
#   * a tag `vX.Y.Z` publishes to PyPI;
#   * a manual dispatch publishes the same artefacts to TestPyPI, so a broken README or a
#     bad classifier is caught before it is immutable.
#
# Authentication is OIDC trusted publishing. There is no API token in this file, in the
# repository, or in anyone's shell history: GitHub proves the workflow's identity to PyPI,
# and the `release` environment is the one the publisher is registered against.
#
# Build and publish are separate jobs on purpose. Environment protection rules gate a job
# *before its first step*, so a single job would ask for approval before anything had been
# built. Here the reviewer approves after the gates, the artefacts and the smoke install
# have all succeeded, with the uploaded artefacts in hand.

on:
  push:
    tags: ["v*"]
  # No inputs: a dispatch is a rehearsal, and a rehearsal goes to TestPyPI. An input that
  # only ever had one legal value would be a knob pretending to be a choice.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One release pipeline at a time. A rehearsal for 0.1.0 and a tag for 0.1.0 upload
  # different indexes, but two runs of the same workflow racing is still a mess to read.
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # The same gate set CI runs. A tag can be pushed from a commit whose CI never
      # finished, and publishing something that fails its own tests is not a release.
      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src scripts

      - name: Test
        run: uv run pytest --cov

      - name: Check documentation links
        run: uv run python scripts/check_docs_links.py

      # A tag is a promise about what is inside. If `v0.2.0` is on a commit that says
      # 0.1.0, the artefact and the tag disagree and nobody can tell which is true.
      - name: Check the tag matches pyproject
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check the artefacts
        run: uv run --with twine twine check dist/*

      # A wheel that installs but cannot import is the classic release bug, and the
      # cheapest place to catch it is here, before an upload.
      - name: Install the wheel in a clean environment
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/python" -c "import pydantic_rag_agent; print(pydantic_rag_agent.__version__)"
          "$RUNNER_TEMP/smoke/bin/pydantic-rag-agent" --help >/dev/null

      # The base install above proves nothing about the extras: neither `import
      # pydantic_rag_agent` nor `--help` touches Streamlit, FastAPI, chromadb or boto3.
      # 0.2.0 shipped its whole public addition behind `[ui]` and this step would have
      # reported success even if that extra were broken. Run the same probes the local
      # release script uses, so the two gates cannot disagree about what "works" means.
      #
      # The extras list is read from pyproject.toml rather than written here: a hardcoded
      # list drifts the moment someone adds an extra, and then the gate silently stops
      # covering it — which is the same class of bug this step exists to prevent.
      - name: Install every extra and import its entry point
        run: |
          wheel=$(ls dist/*.whl | head -1)
          extras=$(
            "$RUNNER_TEMP/smoke/bin/python" -c "
          import tomllib
          deps = tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies']
          print(','.join(n for n, r in deps.items() if not any(x.startswith('pydantic-rag-agent') for x in r)))
          "
          )
          echo "extras: $extras (from $wheel)"
          uv venv "$RUNNER_TEMP/extras"
          uv pip install --python "$RUNNER_TEMP/extras/bin/python" "$wheel[$extras]"
          "$RUNNER_TEMP/extras/bin/python" - <<'PROBES'
          from pydantic_rag_agent.adapters.chroma_store import ChromaVectorStore
          from pydantic_rag_agent.adapters.document_store.s3 import S3DocumentStore
          from pydantic_rag_agent.extras import require
          from pydantic_rag_agent.integrations.fastapi import (
              create_app,
              create_openai_router,
              create_router,
          )
          from pydantic_rag_agent.ui import rag_chat, rag_chat_client

          require("s3", "boto3")
          print("  ok:", ChromaVectorStore.__name__, S3DocumentStore.__name__)
          print("  ok:", create_app.__name__, create_router.__name__, create_openai_router.__name__)
          print("  ok:", rag_chat.__name__, rag_chat_client.__name__)
          PROBES

      # And the extras must not leak back into the core install: `pip install
      # pydantic-rag-agent` has to stay small, and an import moved to module scope would
      # silently undo that.
      - name: Check the base install stays lean
        run: |
          "$RUNNER_TEMP/smoke/bin/python" - <<'LEAN'
          import importlib.util as util
          import sys

          leaked = [name for name in ("chromadb", "fastapi", "streamlit", "boto3") if util.find_spec(name)]
          sys.exit(f"extras leaked into the base install: {leaked}" if leaked else 0)
          LEAN

      # Handed to the publish job, which is the one a reviewer gates.
      - name: Upload the artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # the OIDC token trusted publishing exchanges for an upload

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Download the built artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        run: uv publish dist/* --publish-url https://test.pypi.org/legacy/ --trusted-publishing always

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        run: uv publish dist/* --trusted-publishing always
