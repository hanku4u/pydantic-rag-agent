name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # setup-uv publishes exact version tags only — there is no floating `v10`
      # ref, so pinning to a major silently fails to resolve at job setup.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # --locked fails when pyproject.toml and uv.lock disagree, which is the
      # usual way a uv project silently drifts from its pinned graph. CI should
      # reject that rather than re-resolve and report a green build.
      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

      - name: Check documentation links
        run: uv run python scripts/check_docs_links.py
